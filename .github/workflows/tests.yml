name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel outdated runs on the same PR/branch to save CI quota
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  lint:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Check formatting
        run: |
          clang-format --version
          # Every tracked C++ file (engine, plugins, editor, tests, R-Type, TrackNTrap), except the
          # *_main.cpp files the editor generates
          mapfile -d '' files < <(git ls-files -z -- '*.cpp' '*.hpp' ':(exclude)*_main.cpp')
          echo "Checking ${#files[@]} files"
          clang-format --style=file:Norms/.clang-format --dry-run -Werror "${files[@]}"

  tests:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (OpenGL / X11 for raylib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            clang-tidy

      # CPM sources are cached: re-downloaded only when a dependency changes
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # R-Type/*_main.cpp are generated by the editor and gitignored: generate them before the build.
      # Both build folders are configured first so they use the CPM cache and skip clang-tidy (the
      # clang-tidy step below already analyses the code)
      - name: Generate the R-Type client and server mains
        run: |
          for dir in "Gringo Engine/build" "R-Type/build"; do
            cmake -S "Gringo Engine" -B "$dir" -DENABLE_CLANG_TIDY=OFF -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          done
          cmake --build "Gringo Engine/build" --target Gringo --parallel
          "Gringo Engine/Gringo" --build R-Type/R-Type.gringo

      - name: Run tests
        run: ./tests/tests.sh

      # engine_tests and network_tests only exist with GRINGO_BUILD_TESTS=ON (OFF by default)
      - name: Engine unit tests
        run: |
          cmake -S "Gringo Engine" -B build-unit -DGRINGO_BUILD_TESTS=ON -DENABLE_CLANG_TIDY=OFF \
                -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build build-unit --target engine_tests network_tests --parallel
          ctest --test-dir build-unit --output-on-failure

      - name: clang-tidy (build with analysis)
        run: |
          cmake -B build-tidy -DENABLE_CLANG_TIDY=ON
          cmake --build build-tidy --parallel

  # Same build as the README's Windows instructions (MSVC, x64, Release), then the engine unit tests
  # and a check that the server really starts (it finds its DLLs, plugins and R-Type.gringo).
  # The client is only built: the runner has no GPU to open its OpenGL window
  windows:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # clang-tidy is off: the Linux job already runs it
      - name: Build the R-Type client and server
        run: |
          $cache = "$env:CPM_SOURCE_CACHE" -replace '\\', '/'
          cmake -S . -B build -A x64 -DENABLE_CLANG_TIDY=OFF "-DCPM_SOURCE_CACHE=$cache"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release --target r-type_client r-type_server --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Engine unit tests
        run: |
          $cache = "$env:CPM_SOURCE_CACHE" -replace '\\', '/'
          cmake -S "Gringo Engine" -B build-unit -A x64 -DGRINGO_BUILD_TESTS=ON `
                -DENABLE_CLANG_TIDY=OFF "-DCPM_SOURCE_CACHE=$cache"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-unit --config Release --target engine_tests network_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build-unit -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The server starts and listens
        run: |
          if (-not (Test-Path .\r-type_client.exe)) { Write-Error "r-type_client.exe was not built"; exit 1 }
          $server = Start-Process -FilePath .\r-type_server.exe -ArgumentList '127.0.0.1', '4242' `
                    -PassThru -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server.err
          Start-Sleep -Seconds 5
          $listening = Get-NetUDPEndpoint -LocalPort 4242 -ErrorAction SilentlyContinue
          $alive = -not $server.HasExited
          if ($alive) { Stop-Process -Id $server.Id -Force }
          Get-Content server.log, server.err -ErrorAction SilentlyContinue
          if (-not $alive) { Write-Error "r-type_server.exe exited with code $($server.ExitCode)"; exit 1 }
          if (-not $listening) { Write-Error "r-type_server.exe is not listening on UDP 4242"; exit 1 }
          Write-Output "r-type_server.exe is running and listening on UDP 4242"