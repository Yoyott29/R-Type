name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel outdated runs on the same PR/branch to save CI quota
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  lint:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Check formatting
        run: |
          clang-format --version
          # Every tracked C++ file (engine, plugins, editor, tests, R-Type, TrackNTrap), except the
          # *_main.cpp files the editor generates
          mapfile -d '' files < <(git ls-files -z -- '*.cpp' '*.hpp' ':(exclude)*_main.cpp')
          echo "Checking ${#files[@]} files"
          clang-format --style=file:Norms/.clang-format --dry-run -Werror "${files[@]}"

  tests:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (OpenGL / X11 for raylib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            clang-tidy

      # CPM sources are cached: re-downloaded only when a dependency changes
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # R-Type/*_main.cpp are generated by the editor and gitignored: generate them before the build.
      # Both build folders are configured first so they use the CPM cache and skip clang-tidy (the
      # clang-tidy step below already analyses the code)
      - name: Generate the R-Type client and server mains
        run: |
          for dir in "Gringo Engine/build" "R-Type/build"; do
            cmake -S "Gringo Engine" -B "$dir" -DENABLE_CLANG_TIDY=OFF -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          done
          cmake --build "Gringo Engine/build" --target Gringo --parallel
          "Gringo Engine/Gringo" --build R-Type/R-Type.gringo

      - name: Run tests
        run: ./tests/tests.sh

      # engine_tests and network_tests only exist with GRINGO_BUILD_TESTS=ON (OFF by default)
      - name: Engine unit tests
        run: |
          cmake -S "Gringo Engine" -B build-unit -DGRINGO_BUILD_TESTS=ON -DENABLE_CLANG_TIDY=OFF \
                -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build build-unit --target engine_tests network_tests --parallel
          ctest --test-dir build-unit --output-on-failure

      - name: clang-tidy (build with analysis)
        run: |
          cmake -B build-tidy -DENABLE_CLANG_TIDY=ON
          cmake --build build-tidy --parallel