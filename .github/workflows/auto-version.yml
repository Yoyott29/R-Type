name: auto-version

on:
  # Every merge on main creates a minor version (1.1, 1.2, 1.3...)
  push:
    branches:
      - main
  # Manual run from the Actions tab creates a major version (2.0, 3.0...)
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: "R-Type"

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and release notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          BRANCH="${GITHUB_REF_NAME}"
          EVENT_NAME="${GITHUB_EVENT_NAME}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          PROJECT="${PROJECT_NAME:-${GITHUB_REPOSITORY#*/}}"

          # A version can only be created from main
          if [[ "$BRANCH" != "main" ]]; then
            echo "::error::Versions can only be created from main."
            exit 1
          fi

          # All vX.Y version tags, sorted from newest to oldest
          ALL_TAGS="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+$' || true)"
          LAST_TAG="$(echo "$ALL_TAGS" | head -n 1)"

          if [[ -n "$LAST_TAG" ]]; then
            LAST_MAJOR="${LAST_TAG#v}"
            LAST_MAJOR="${LAST_MAJOR%%.*}"
            LAST_MINOR="${LAST_TAG#*.}"
          else
            # No tag yet: start from v1.0, so the first merge gives v1.1
            LAST_MAJOR=1
            LAST_MINOR=0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # ---------- MAJOR VERSION (2.0, 3.0...): manual run ----------
            NEW_TAG="v$((LAST_MAJOR + 1)).0"
            NEW_TITLE="${PROJECT} ${NEW_TAG}"

            # Minor versions published since the last major version
            SUBS="$(echo "$ALL_TAGS" | grep -E "^v${LAST_MAJOR}\.[1-9][0-9]*$" | sort -V || true)"

            {
              echo "## ${NEW_TITLE}"
              echo
              echo "### Included minor versions"
              if [[ -n "$SUBS" ]]; then
                while read -r SUB_TAG; do
                  echo "- [${PROJECT} ${SUB_TAG}](${REPO_URL}/releases/tag/${SUB_TAG})"
                done <<< "$SUBS"
              else
                echo "- No minor version since the last major version."
              fi
            } > release_notes.md

          else
            # ---------- MINOR VERSION (1.1, 1.2, 1.3...): merge on main ----------
            NEW_TAG="v${LAST_MAJOR}.$((LAST_MINOR + 1))"
            NEW_TITLE="${PROJECT} ${NEW_TAG}"

            if [[ -n "$LAST_TAG" ]]; then
              CHANGE_HEADER="### Changes since ${PROJECT} ${LAST_TAG}"
              CHANGE_LOG="$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:'- %s (%h)' | head -n 50 || true)"
            else
              CHANGE_HEADER="### Changes (initial version)"
              CHANGE_LOG="$(git log --no-merges --pretty=format:'- %s (%h)' | head -n 50 || true)"
            fi

            if [[ -z "$CHANGE_LOG" ]]; then
              CHANGE_LOG="- No changes detected."
            fi

            {
              echo "## ${NEW_TITLE}"
              echo
              echo "${CHANGE_HEADER}"
              echo "${CHANGE_LOG}"
            } > release_notes.md
          fi

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${NEW_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest