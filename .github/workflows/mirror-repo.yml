name: mirror-to-epitech

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  TARGET_REPO: EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4

jobs:
  mirror:
    if: github.repository != 'EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_mirror
          chmod 600 ~/.ssh/id_mirror
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Sync all branches and tags
        run: |
          set -euo pipefail
          TARGET="git@github.com:${TARGET_REPO}.git"

          # Get every branch and tag of the mirror, and drop the ones deleted there
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --tags --force
          git remote set-head origin -d 2>/dev/null || true

          # Safety: never wipe the target if the fetch returned nothing
          if [[ -z "$(git for-each-ref refs/remotes/origin)" ]]; then
            echo "::error::No branches found on the mirror, aborting."
            exit 1
          fi

          # --force: same history rewrites as the mirror
          # --prune: delete on the target what no longer exists on the mirror
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_mirror -o IdentitiesOnly=yes" \
          git push "$TARGET" --force --prune \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'